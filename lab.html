<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Otocloud – Call Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<style>
  :root { --paper:#D9DADD; --surface:#E8E9EB; --ink:#151517; --mute:#74767C; --line:#C2C4C8; --live:#12A867; --danger:#E5484D; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Instrument Sans','Zen Kaku Gothic New',-apple-system,sans-serif; min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:380px; background:var(--surface); border-radius:24px; padding:28px 24px; box-shadow:0 20px 40px -24px rgba(0,0,0,.4); }
  h1 { font-family:'Unbounded',sans-serif; font-size:22px; letter-spacing:-.02em; }
  .sub { color:var(--mute); font-size:13px; margin:6px 0 22px; line-height:1.6; }
  input { width:100%; height:64px; border-radius:16px; border:1px solid var(--line); background:#fff; text-align:center; font:700 30px 'Unbounded',sans-serif; letter-spacing:.2em; color:var(--ink); outline:none; }
  input:focus { border-color:var(--ink); }
  button { font:inherit; cursor:pointer; border:0; width:100%; height:52px; border-radius:16px; font-weight:700; font-size:16px; margin-top:12px; background:var(--ink); color:#fff; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  button.end { background:var(--danger); }
  .status { display:flex; align-items:center; gap:10px; margin-top:18px; font-size:14px; color:var(--mute); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--line); }
  .dot.on { background:var(--live); }
  .vol { margin-top:16px; }
  .vol label { font-size:13px; color:var(--mute); }
  .vol input[type=range] { height:auto; border:0; background:transparent; padding:0; width:100%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>Call Lab</h1>
  <p class="sub">iPhoneのOtocloudに出ている6桁の番号を入れると、同じ部屋で通話できます。</p>
  <div id="pre">
    <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button id="join">Join</button>
  </div>
  <div id="live" hidden>
    <button class="ghost" id="mute">Mute</button>
    <div class="vol"><label>Their voice</label><input type="range" id="vv" min="0" max="100" value="100"></div>
    <button class="end" id="end">End</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="st">Not connected</span></div>
</div>
<script>
const WORKER = 'https://geocloud.icchasong.workers.dev';
const LK_URL = 'wss://otocloud-wygn7mrs.livekit.cloud';
firebase.initializeApp({
  apiKey: 'AIzaSyB_bITavjyZJ86Ky9BHjYJb9IcXbieHA0g',
  authDomain: 'onpa-e7cc6.firebaseapp.com',
  databaseURL: 'https://onpa-e7cc6-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'onpa-e7cc6',
});
const $ = (id) => document.getElementById(id);
let room = null;
const status = (t, on) => { $('st').textContent = t; $('dot').className = 'dot' + (on ? ' on' : ''); };
$('code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });

$('join').addEventListener('click', async () => {
  const code = $('code').value;
  if (code.length !== 6) { status('6桁の番号を入れてください'); return; }
  $('join').disabled = true;
  try {
    status('Signing in…');
    const cred = await firebase.auth().signInAnonymously();
    const uid = cred.user.uid;
    const name = 'lab' + code;
    await firebase.database().ref(`rooms/${name}/call/to`).set(uid);
    status('Getting a pass…');
    const idToken = await cred.user.getIdToken();
    const r = await fetch(`${WORKER}/livekit-token?room=${name}&name=Mac`, { headers: { Authorization: 'Bearer ' + idToken } });
    const d = await r.json();
    if (!d.token) throw new Error(d.error || 'no token');
    room = new LivekitClient.Room({ webAudioMix: true });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => { if (track.kind === 'audio') { track.attach(); applyVol(); } });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, () => status('On call', true));
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => status('They left'));
    room.on(LivekitClient.RoomEvent.Disconnected, () => { status('Not connected'); $('pre').hidden = false; $('live').hidden = true; });
    await room.connect(LK_URL, d.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    await room.startAudio();
    status(room.remoteParticipants.size ? 'On call' : 'Waiting for iPhone…', room.remoteParticipants.size > 0);
    $('pre').hidden = true; $('live').hidden = false;
  } catch (e) {
    status('Could not join: ' + e.message);
  } finally {
    $('join').disabled = false;
  }
});
function applyVol() {
  if (!room) return;
  const v = Number($('vv').value) / 100;
  room.remoteParticipants.forEach((p) => p.setVolume(v));
}
$('vv').addEventListener('input', applyVol);
$('mute').addEventListener('click', async () => {
  const on = room.localParticipant.isMicrophoneEnabled;
  await room.localParticipant.setMicrophoneEnabled(!on);
  $('mute').textContent = on ? 'Unmute' : 'Mute';
});
$('end').addEventListener('click', () => { if (room) room.disconnect(); });
</script>
</body>
</html>
