<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Onpa – SoundCloud Test</title>
<link rel="preconnect" href="https://geocloud.icchasong.workers.dev">
<link rel="preconnect" href="https://playback.media-streaming.soundcloud.cloud">
<link rel="preconnect" href="https://i1.sndcdn.com">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  :root { --bg: #0b0b0f; --card: #15151b; --line: #24242c; --sub: #8e8e98; --accent: #ff5500; --accent2: #ec4899; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: #fff; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 16px 160px; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p.sub { color: var(--sub); font-size: 13px; margin: 4px 0 20px; }
  .search { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: #fff; font-size: 16px; outline: none; transition: border-color .2s; }
  .search:focus { border-color: var(--accent); }

  .item { display: flex; align-items: center; gap: 12px; padding: 8px; margin-top: 6px; border-radius: 14px; cursor: pointer; transition: background .15s; }
  .item:hover { background: var(--card); }
  .item.active { background: var(--card); }
  .item img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: linear-gradient(135deg, var(--accent), var(--accent2)); flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.active .t { color: var(--accent); }
  .a { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; width: 16px; }
  .item.active.playing .eq { display: flex; }
  .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.6s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  .msg { text-align: center; color: var(--sub); padding: 24px; font-size: 14px; }

  /* 再生バー */
  .bar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 464px; margin: 0 auto; padding: 12px 14px 10px; border-radius: 18px; background: rgba(28, 28, 36, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,.5); transform: translateY(140%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .bar.on { transform: translateY(0); }
  .bar .top { display: flex; align-items: center; gap: 12px; }
  .bar img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .bar .info .t { font-size: 14px; }
  .pp { width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; color: #000; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; transition: transform .1s; }
  .pp:active { transform: scale(.92); }
  .pp svg { width: 18px; height: 18px; }
  .spin { width: 18px; height: 18px; border: 2px solid #0003; border-top-color: #000; border-radius: 50%; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* シークバー */
  .seek { position: relative; height: 22px; margin-top: 8px; cursor: pointer; touch-action: none; }
  .seek .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: #ffffff22; overflow: hidden; }
  .seek .buf { position: absolute; left: 0; top: 0; bottom: 0; background: #ffffff22; }
  .seek .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .seek .knob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); transform: scale(0); transition: transform .15s; }
  .seek:hover .knob, .seek.drag .knob { transform: scale(1); }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #ff550022; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>SoundCloud Test</h1>
  <p class="sub">Onpa用のテストページ（公式API・フル再生）</p>
  <input class="search" id="q" type="search" placeholder="曲名やアーティストで検索" autocomplete="off">
  <div id="list"></div>
</div>

<div class="bar" id="bar">
  <div class="top">
    <img id="barArt" alt="">
    <div class="info"><div class="t" id="now"></div><div class="a" id="nowArtist"></div></div>
    <button class="pp" id="pp" aria-label="再生/一時停止"></button>
  </div>
  <div class="seek" id="seek"><div class="track"><div class="buf" id="buf"></div><div class="fill" id="fill"></div></div><div class="knob" id="knob"></div></div>
  <div class="times"><span id="cur">0:00</span><span class="badge" id="kind"></span><span id="dur">0:00</span></div>
</div>

<script>
const WORKER = 'https://geocloud.icchasong.workers.dev';
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>';

const player = new Audio();
player.preload = 'auto';
let hls = null, currentEl = null, token = 0, timer = null, loading = false, dragging = false;
const playCache = new Map(); // 同じ曲は再取得しない

const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ===== 検索 =====
$('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 2) { $('list').innerHTML = ''; return; }
  timer = setTimeout(() => search(q), 350);
});

async function search(q) {
  $('list').innerHTML = '<div class="msg">検索中…</div>';
  try {
    const r = await fetch(`${WORKER}/search?q=${encodeURIComponent(q)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    if (!d.length) { $('list').innerHTML = '<div class="msg">見つかりませんでした</div>'; return; }
    $('list').innerHTML = d.map((t) => `
      <div class="item" data-id="${t.id}" data-title="${esc(t.title)}" data-artist="${esc(t.artist)}" data-art="${esc(t.artwork)}" onclick="tap(this)">
        <img src="${esc(t.artwork)}" alt="" loading="lazy" onerror="this.removeAttribute('src')">
        <div class="info"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)} · ${fmt(t.duration / 1000)}</div></div>
        <div class="eq"><i></i><i></i><i></i></div>
      </div>`).join('');
    if (currentEl) markActive(currentEl.dataset.id);
    // 上の3曲は先に再生URLを取っておく（押したらすぐ鳴るように）
    d.slice(0, 3).forEach((t) => getPlay(t.id).catch(() => {}));
  } catch (e) {
    $('list').innerHTML = `<div class="msg">検索に失敗しました（${esc(e.message)}）</div>`;
  }
}

function getPlay(id) {
  const hit = playCache.get(String(id));
  if (hit && hit.exp > Date.now()) return hit.p;
  const p = fetch(`${WORKER}/play?id=${id}`).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    return d;
  });
  playCache.set(String(id), { p, exp: Date.now() + 8 * 60 * 1000 });
  p.catch(() => playCache.delete(String(id)));
  return p;
}

// ===== 曲をタップ =====
function tap(el) {
  // 同じ曲：一時停止 ⇄ 再開
  if (currentEl && currentEl.dataset.id === el.dataset.id && !loading) { togglePause(); return; }
  load(el);
}

async function load(el) {
  const my = ++token;
  if (hls) { hls.destroy(); hls = null; }
  currentEl = el;
  loading = true;
  markActive(el.dataset.id);
  showBar(el);
  setButton('loading');

  // iPhone対策：タップした瞬間にプレーヤーを起こす
  player.src = SILENT;
  player.play().catch(() => {});

  try {
    const d = await getPlay(el.dataset.id);
    if (my !== token) return;
    $('kind').textContent = d.kind === 'full' ? 'FULL' : '30秒プレビュー';

    if (d.hls && window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 20, startFragPrefetch: true });
      hls.loadSource(d.url);
      hls.attachMedia(player);
      await new Promise((ok, ng) => {
        hls.once(Hls.Events.MANIFEST_PARSED, ok);
        hls.on(Hls.Events.ERROR, (ev, x) => { if (x.fatal) ng(new Error(x.details)); });
      });
    } else {
      player.src = d.url;
    }
    if (my !== token) return;
    await player.play();
  } catch (e) {
    if (my !== token) return;
    console.error(e);
    playCache.delete(el.dataset.id);
    setButton('play');
    alert('再生できませんでした：' + e.message);
  } finally {
    if (my === token) loading = false;
  }
}

function togglePause() {
  if (!currentEl || loading) return;
  if (player.paused) player.play().catch(() => {});
  else player.pause();
}
$('pp').addEventListener('click', togglePause);

// ===== 表示 =====
function markActive(id) {
  document.querySelectorAll('.item').forEach((i) => i.classList.toggle('active', i.dataset.id === String(id)));
}
function showBar(el) {
  $('now').textContent = el.dataset.title;
  $('nowArtist').textContent = el.dataset.artist;
  if (el.dataset.art) $('barArt').src = el.dataset.art; else $('barArt').removeAttribute('src');
  $('fill').style.width = '0%'; $('buf').style.width = '0%'; $('knob').style.left = '0%';
  $('cur').textContent = '0:00'; $('dur').textContent = '0:00';
  $('bar').classList.add('on');
}
function setButton(s) {
  $('pp').innerHTML = s === 'loading' ? '<div class="spin"></div>' : s === 'pause' ? ICON_PAUSE : ICON_PLAY;
}
const isReal = () => player.src !== SILENT || hls;

player.addEventListener('playing', () => {
  if (!isReal()) return;
  setButton('pause');
  document.querySelectorAll('.item.active').forEach((i) => i.classList.add('playing'));
});
player.addEventListener('pause', () => { if (!loading) setButton('play'); document.querySelectorAll('.item').forEach((i) => i.classList.remove('playing')); });
player.addEventListener('waiting', () => { if (isReal()) setButton('loading'); });
player.addEventListener('ended', () => { if (isReal()) { setButton('play'); player.currentTime = 0; } });

player.addEventListener('timeupdate', () => {
  if (!isReal() || dragging) return;
  drawProgress(player.currentTime);
});
player.addEventListener('progress', () => {
  if (!isFinite(player.duration) || !player.buffered.length) return;
  $('buf').style.width = (player.buffered.end(player.buffered.length - 1) / player.duration * 100) + '%';
});
function drawProgress(t) {
  const d = player.duration;
  if (!isFinite(d) || !d) return;
  const pct = Math.min(100, t / d * 100);
  $('fill').style.width = pct + '%';
  $('knob').style.left = pct + '%';
  $('cur').textContent = fmt(t);
  $('dur').textContent = fmt(d);
}

// ===== シークバー（指でもマウスでも） =====
const seek = $('seek');
function posToTime(x) {
  const r = seek.getBoundingClientRect();
  return Math.max(0, Math.min(1, (x - r.left) / r.width)) * (player.duration || 0);
}
seek.addEventListener('pointerdown', (e) => {
  if (!isFinite(player.duration)) return;
  dragging = true; seek.classList.add('drag'); seek.setPointerCapture(e.pointerId);
  drawProgress(posToTime(e.clientX));
});
seek.addEventListener('pointermove', (e) => { if (dragging) drawProgress(posToTime(e.clientX)); });
seek.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false; seek.classList.remove('drag');
  player.currentTime = posToTime(e.clientX);
});
seek.addEventListener('pointercancel', () => { dragging = false; seek.classList.remove('drag'); });

setButton('play');
</script>
</body>
</html>
